# ===================================================
# KILLER KISS - Configuración local (SQLite + Gmail)
# ===================================================
server.port=8080

# Cargar credenciales desde mail.config (no se commitea)
spring.config.import=optional:file:mail.config,optional:classpath:mail.config

# ===== SQLite =====
spring.datasource.url=jdbc:sqlite:killer-kiss.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Crear tabla usuarios (AuthController usa JdbcTemplate, no JPA)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===== Gmail SMTP =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.username=${gmail.username:${GMAIL_USERNAME:}}
spring.mail.password=${gmail.password:${GMAIL_PASSWORD:}}

# ===== Logging =====
logging.level.org.springframework=INFO
logging.level.org.example=DEBUG
